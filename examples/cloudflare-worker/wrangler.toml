name = "clockify-mcp"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[vars]
# Default access mode when the client omits X-Clockify-Access-Mode / consent choice.
# Matches the Python server: read | time-tracking | full
DEFAULT_ACCESS_MODE = "read"
# Default region when the client omits X-Clockify-Region / consent choice.
# global | euc1 | use2 | euw2 | apse2
DEFAULT_REGION = "global"
# Workspace plan gate: free | standard | pro | all
# free hides tools that declare minPlan standard/pro (Wave 2+ paid domains).
DEFAULT_PLAN = "free"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "584ec0fa1bbf4f5481ade9b4d916dc12"
