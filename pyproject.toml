[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clockify-mcp"
version = "0.3.1"
description = "Full-coverage Clockify MCP — 112 tools across 18 domains (incl. invoices, scheduling, time-off & approvals), native OpenTelemetry observability, and a 3-tier read/time-tracking/full access model."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alan (tracegazer)" }]
keywords = ["mcp", "clockify", "time-tracking", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
telemetry = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
clockify-mcp = "clockify_mcp.server:main"

[project.urls]
Homepage = "https://github.com/tracegazer/clockify-mcp"
Repository = "https://github.com/tracegazer/clockify-mcp"
Issues = "https://github.com/tracegazer/clockify-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/clockify_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/clockify_mcp/py.typed" = "clockify_mcp/py.typed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
